{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Sign in</h1>
  <form id="loginForm" method="post" action="/login" autocomplete="off">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">User ID</label>
    <input id="username" name="username" type="text" value="{{ username }}" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    {% if error %}<div id="loginError" class="msg msg-error" role="alert">{{ error }}</div>{% endif %}
    <button id="btnLogin" type="submit" class="btn btn-primary">Sign in</button>
  </form>
</section>
{% endblock %}
