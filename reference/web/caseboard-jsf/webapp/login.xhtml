<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/template.xhtml">
  <ui:define name="title">Sign in</ui:define>
  <ui:define name="content">
    <h1>Sign in</h1>
    <h:messages id="messages" styleClass="messages" errorClass="error" infoClass="info"/>
    <h:form id="loginForm">
      <h:panelGrid columns="2" styleClass="fields">
        <h:outputLabel for="username" value="User name"/>
        <h:inputText id="username" value="#{login.username}" required="true"
                     requiredMessage="User name is required"/>
        <h:outputLabel for="password" value="Password"/>
        <h:inputSecret id="password" value="#{login.password}"/>
      </h:panelGrid>
      <h:commandButton id="signIn" value="Sign in" action="#{login.signIn}"/>
    </h:form>
  </ui:define>
</ui:composition>
