<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<f:metadata>
  <f:viewAction action="#{login.guard}"/>
</f:metadata>
<h:head>
  <title>Caseboard PF - Case page</title>
  <h:outputStylesheet library="css" name="caseboard.css"/>
</h:head>
<h:body>
  <div class="bar"><span class="brand">Caseboard PF</span></div>
  <div class="main">
    <!-- Reached by a postback that forwarded here: the address bar shows /workspace.xhtml. -->
    <h1>Case page</h1>
    <h:form id="casePage">
      <table class="fields">
        <tr><td>Number</td><td><h:outputText id="pageNumber" value="#{work.detail.number}"/></td></tr>
        <tr><td>Title</td><td><h:outputText id="pageTitle" value="#{work.detail.title}"/></td></tr>
        <tr><td>Owner</td><td><h:outputText id="pageOwner" value="#{work.detail.owner}"/></td></tr>
        <tr><td>Status</td><td><h:outputText id="pageStatus" value="#{work.detail.status}"/></td></tr>
      </table>
      <!-- Back is a postback that forwards too: the address bar then shows /case.xhtml. -->
      <p:commandButton id="backToWorkspace" value="Back to the workspace"
                       action="#{work.backToWorkspace}" ajax="false"/>
    </h:form>
  </div>
</h:body>
</html>
