<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
  <title>Caseboard PF - Sign in</title>
  <h:outputStylesheet library="css" name="caseboard.css"/>
</h:head>
<h:body>
  <div class="bar"><span class="brand">Caseboard PF</span></div>
  <div class="main">
    <h1>Sign in</h1>
    <!-- Sign in is a full postback (ajax="false") that FORWARDS to the workspace: the address
         bar keeps showing /login.xhtml while the workspace is shown. -->
    <h:form id="loginForm">
      <p:messages id="messages"/>
      <div class="field">
        <p:outputLabel for="username" value="User name"/>
        <p:inputText id="username" value="#{login.username}" required="true"
                     requiredMessage="User name is required"/>
      </div>
      <div class="field">
        <p:outputLabel for="password" value="Password"/>
        <p:password id="password" value="#{login.password}"/>
      </div>
      <p:commandButton id="signIn" value="Sign in" action="#{login.signIn}" ajax="false"/>
    </h:form>
  </div>
</h:body>
</html>
