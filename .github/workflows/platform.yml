name: platform
on:
  push:
    paths: ["lab/**", "reference/**/backend/**", "specs/**", "automations/**", "conditions/**", "data-packs/**", "apps/*/app.yaml", "pyproject.toml", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["lab/**", "reference/**/backend/**", "specs/**", "automations/**", "conditions/**", "data-packs/**", "apps/*/app.yaml", "pyproject.toml", ".github/workflows/platform.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: labctl validate
