name: platform
on:
  push:
    paths: ["lab/**", "reference/**", "tools/**", "specs/**", "automations/**", "flows/**", "conditions/**", "data-packs/**", "apps/**", "pyproject.toml", ".github/workflows/platform.yml"]
  # Every pull request runs the tests: `test` is a required check on main, and a required check
  # that a path filter skips would block the merge for good.
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Browser for readiness checks, recorder and fidelity tests
        run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - name: Platform, lab agent and showcase reference tests (Docker tests run on this runner)
        run: pytest -q
      - name: QTT stand-in tests (its own package, run separately)
        run: python -m pytest -q -c reference/qtt-sample/pytest.ini reference/qtt-sample/tests
      - run: labctl validate
