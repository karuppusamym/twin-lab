# End to end on a real lab: build showcase and the lab agent, start the lab, then for each
# automation run `labctl e2e` (contracts, lab copy, readiness, harness bot run under a
# condition with session and verdict, fidelity replay, cleanup). The reports are kept as an
# artifact. Not a required check: it builds images and takes several minutes.
name: e2e
on:
  push:
    branches: [main]
    paths: ["apps/**", "lab/**", "tools/**", "automations/**", "conditions/**", "pyproject.toml", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["apps/**", "lab/**", "tools/**", "automations/**", "conditions/**", "pyproject.toml", ".github/workflows/e2e.yml"]
  workflow_dispatch:
    inputs:
      automation:
        description: "Automation to run (default: uipath-case-update)"
        required: false
      condition:
        description: "Condition for the bot run (default: slow-database)"
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTOMATION: ${{ inputs.automation || 'uipath-case-update' }}
      CONDITION: ${{ inputs.condition || 'slow-database' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Browser for readiness, the harness bot and fidelity replay
        run: python -m playwright install --with-deps chromium
      - name: End to end
        run: labctl e2e "$AUTOMATION" --condition "$CONDITION" --out e2e-report
      - name: Report in the run summary
        if: always()
        run: cat e2e-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Lab logs on failure
        if: failure()
        run: |
          for f in .lab-state/compose/*.yml; do
            echo "::group::$f"; docker compose -f "$f" logs --tail 200 || true; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e-report
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: |
          for f in .lab-state/compose/*.yml; do docker compose -f "$f" down -v || true; done
