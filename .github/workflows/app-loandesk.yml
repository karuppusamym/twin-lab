# Pipeline for the loandesk demo app (written by labctl brief). The steps are in app.yml.
name: app-loandesk
on:
  push:
    branches: [main]
    paths: ["apps/loandesk/**", "automations/**", "lab/**", ".github/workflows/app.yml", ".github/workflows/app-loandesk.yml"]
  pull_request:
    paths: ["apps/loandesk/**", "automations/**", "lab/**", ".github/workflows/app.yml", ".github/workflows/app-loandesk.yml"]
jobs:
  app:
    uses: ./.github/workflows/app.yml
    with:
      app: loandesk
