[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-lab"
version = "0.0.1"
description = "Build, host and control demo copies of the applications automations touch."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
    "SQLAlchemy>=2.0",
    "pymssql>=2.3",   # demo databases on SQL Server (labctl db, tables on Start)
    "oracledb>=2.0",  # demo databases on Oracle, thin mode: no client install
    "cryptography>=42",
    "playwright>=1.44",
    "pypdf>=4.0",  # text and form fields of PDFs an app shows (recorder)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.12.11", "starlette>=0.37", "asyncpg>=0.29", "pymupdf>=1.24"]
# OCR of drawn screens (canvas) with Tesseract, on machines without Windows' built-in OCR:
# also needs the `tesseract` program installed.
ocr = ["pytesseract>=0.3", "pillow>=10"]
# Drivers for reading a real replica (labctl realdata); see docs/realdata.md.
mssql = ["pyodbc>=5.0"]       # also needs "ODBC Driver 18 for SQL Server" installed
oracle = ["oracledb>=2.0"]
mysql = ["pymysql>=1.1"]
# Record and verify Windows desktop applications through UI Automation (labctl desktop);
# Windows only. Reading recordings, models and briefs needs nothing extra.
desktop = ["comtypes>=1.4; sys_platform == 'win32'"]

[project.scripts]
labctl = "labctl.cli:app"

[tool.setuptools.packages.find]
where = ["lab/labctl"]
include = ["labctl*"]

[tool.setuptools.package-data]
labctl = ["portal/templates/*.html", "portal/static/*", "licences/*.txt"]

[tool.pytest.ini_options]
testpaths = ["lab/labctl/tests", "reference/case-workbench/backend/tests", "lab/lab-agent/tests"]
pythonpath = ["lab/labctl", "reference/case-workbench/backend", "lab/lab-agent"]
markers = [
    "desktop_gui: starts reference desktop apps and clicks in them (Windows; TWINLAB_DESKTOP_GUI=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["lab/labctl", "reference/case-workbench/backend", "lab/lab-agent"]
extend-exclude = ["node_modules"]

[tool.ruff.lint]
extend-select = ["I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.File", "fastapi.Form"]
