[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-lab"
version = "0.0.1"
description = "Build, host and control demo copies of the applications automations touch."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.12.11", "fastapi>=0.110", "SQLAlchemy>=2.0", "httpx>=0.27", "uvicorn>=0.29"]

[project.scripts]
labctl = "labctl.cli:app"

[tool.setuptools.packages.find]
where = ["lab/labctl"]
include = ["labctl*"]

[tool.pytest.ini_options]
testpaths = ["lab/labctl/tests", "reference/case-workbench/backend/tests"]
pythonpath = ["lab/labctl", "reference/case-workbench/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["lab/labctl", "reference/case-workbench/backend"]
extend-exclude = ["node_modules"]

[tool.ruff.lint]
extend-select = ["I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
