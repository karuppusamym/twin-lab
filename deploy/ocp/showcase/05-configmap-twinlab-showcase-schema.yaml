apiVersion: v1
kind: ConfigMap
metadata:
  name: twinlab-showcase-schema
  namespace: twinlab
  labels:
    app.kubernetes.io/part-of: twinlab
    app.kubernetes.io/instance: showcase
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: twinlab-showcase-agent
    app.kubernetes.io/managed-by: labctl
data:
  schema.sql: |
    -- Schema for the showcase demo app. Generated by labctl brief; do not edit by hand.
    -- Read statically from reference/case-workbench (sha256:3adecca8a37e027b).
    -- Only tables the registered automations need. Left out: canned_response.
    -- Dialect: postgres. Table and column names must not change.

    -- AppUser, models.py:18
    CREATE TABLE app_user (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY NOT NULL,
      username VARCHAR(40) NOT NULL,
      password_hash VARCHAR(64) NOT NULL,
      display_name VARCHAR(80) NOT NULL,
      PRIMARY KEY (id),
      UNIQUE (username)
    );

    -- Customer, models.py:27
    CREATE TABLE customer (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY NOT NULL,
      cust_no VARCHAR(12) NOT NULL,
      full_name VARCHAR(80) NOT NULL,
      email VARCHAR(120) NOT NULL,
      phone VARCHAR(20) NOT NULL,
      city VARCHAR(60) NOT NULL,
      PRIMARY KEY (id),
      UNIQUE (cust_no)
    );
    CREATE INDEX ix_customer_full_name ON customer (full_name);

    -- Category, models.py:38
    CREATE TABLE category (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY NOT NULL,
      code VARCHAR(20) NOT NULL,
      name VARCHAR(60) NOT NULL,
      PRIMARY KEY (id),
      UNIQUE (code)
    );

    -- Subcategory, models.py:46
    CREATE TABLE subcategory (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY NOT NULL,
      category_id INTEGER NOT NULL,
      code VARCHAR(20) NOT NULL,
      name VARCHAR(60) NOT NULL,
      PRIMARY KEY (id),
      UNIQUE (code),
      FOREIGN KEY (category_id) REFERENCES category (id)
    );

    -- Case, models.py:55
    CREATE TABLE cases (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY NOT NULL,
      case_no VARCHAR(12) NOT NULL,
      customer_id INTEGER NOT NULL,
      title VARCHAR(120) NOT NULL,
      status VARCHAR(12) NOT NULL,
      priority VARCHAR(8) NOT NULL,
      category_id INTEGER,
      subcategory_id INTEGER,
      escalation_reason VARCHAR(200),
      opened_at TIMESTAMP WITH TIME ZONE NOT NULL,
      updated_at TIMESTAMP WITH TIME ZONE NOT NULL,
      PRIMARY KEY (id),
      UNIQUE (case_no),
      FOREIGN KEY (customer_id) REFERENCES customer (id),
      FOREIGN KEY (category_id) REFERENCES category (id),
      FOREIGN KEY (subcategory_id) REFERENCES subcategory (id)
    );
    CREATE INDEX ix_cases_status ON cases (status);

    -- CaseNote, models.py:75
    CREATE TABLE case_note (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY NOT NULL,
      case_id INTEGER NOT NULL,
      text VARCHAR(500) NOT NULL,
      author VARCHAR(40) NOT NULL,
      created_at TIMESTAMP WITH TIME ZONE NOT NULL,
      PRIMARY KEY (id),
      FOREIGN KEY (case_id) REFERENCES cases (id)
    );
    CREATE INDEX ix_case_note_case_id ON case_note (case_id);

    -- CaseAudit, models.py:97
    CREATE TABLE case_audit (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY NOT NULL,
      case_id INTEGER NOT NULL,
      event VARCHAR(30) NOT NULL,
      detail VARCHAR(300) NOT NULL,
      actor VARCHAR(40) NOT NULL,
      created_ts TIMESTAMP WITH TIME ZONE NOT NULL,
      PRIMARY KEY (id),
      FOREIGN KEY (case_id) REFERENCES cases (id)
    );
    CREATE INDEX ix_case_audit_case_id ON case_audit (case_id);
