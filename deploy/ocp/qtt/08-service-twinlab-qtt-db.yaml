apiVersion: v1
kind: Service
metadata:
  name: twinlab-qtt-db
  namespace: twinlab
  labels:
    app.kubernetes.io/part-of: twinlab
    app.kubernetes.io/instance: qtt
    app.kubernetes.io/component: db
    app.kubernetes.io/name: twinlab-qtt-db
    app.kubernetes.io/managed-by: labctl
spec:
  selector:
    app.kubernetes.io/instance: qtt
    app.kubernetes.io/component: db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
