apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinlab-qtt-app
  namespace: twinlab
  labels:
    app.kubernetes.io/part-of: twinlab
    app.kubernetes.io/instance: qtt
    app.kubernetes.io/component: app
    app.kubernetes.io/name: twinlab-qtt-app
    app.kubernetes.io/managed-by: labctl
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"twinlab-qtt-app:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: qtt
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: twinlab
        app.kubernetes.io/instance: qtt
        app.kubernetes.io/component: app
        app.kubernetes.io/name: twinlab-qtt-app
        app.kubernetes.io/managed-by: labctl
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/twinlab/twinlab-qtt-app:latest
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: twinlab-qtt-secrets
              key: db-password
        - name: DATABASE_URL
          value: postgresql://lab:$(DB_PASSWORD)@twinlab-qtt-agent:15432/qtt
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /api/health
            port: 8000
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          timeoutSeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          timeoutSeconds: 3
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
