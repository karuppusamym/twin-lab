apiVersion: v1
kind: Service
metadata:
  name: twinlab-qtt-agent
  namespace: twinlab
  labels:
    app.kubernetes.io/part-of: twinlab
    app.kubernetes.io/instance: qtt
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: twinlab-qtt-agent
    app.kubernetes.io/managed-by: labctl
spec:
  selector:
    app.kubernetes.io/instance: qtt
    app.kubernetes.io/component: agent
  ports:
  - name: http
    port: 9000
    targetPort: 9000
    protocol: TCP
  - name: db
    port: 15432
    targetPort: 15432
    protocol: TCP
