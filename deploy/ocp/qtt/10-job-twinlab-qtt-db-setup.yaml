apiVersion: batch/v1
kind: Job
metadata:
  name: twinlab-qtt-db-setup
  namespace: twinlab
  labels:
    app.kubernetes.io/part-of: twinlab
    app.kubernetes.io/instance: qtt
    app.kubernetes.io/component: db-setup
    app.kubernetes.io/name: twinlab-qtt-db-setup
    app.kubernetes.io/managed-by: labctl
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: twinlab
        app.kubernetes.io/instance: qtt
        app.kubernetes.io/component: db-setup
        app.kubernetes.io/name: twinlab-qtt-db-setup
        app.kubernetes.io/managed-by: labctl
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: db-setup
        image: quay.io/sclorg/postgresql-16-c9s
        command:
        - bash
        - /setup/setup.sh
        env:
        - name: PGHOST
          value: twinlab-qtt-db
        - name: PGPORT
          value: '5432'
        - name: PGUSER
          value: postgres
        - name: PGDATABASE
          value: qtt
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: twinlab-qtt-secrets
              key: db-password
        - name: BOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: twinlab-qtt-secrets
              key: bot-password
        volumeMounts:
        - name: setup
          mountPath: /setup
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: setup
        configMap:
          name: twinlab-qtt-db-setup
      restartPolicy: OnFailure
