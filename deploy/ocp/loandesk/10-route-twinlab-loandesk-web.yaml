apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: twinlab-loandesk-web
  namespace: twinlab
  labels:
    app.kubernetes.io/part-of: twinlab
    app.kubernetes.io/instance: loandesk
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: twinlab-loandesk-agent
    app.kubernetes.io/managed-by: labctl
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: twinlab-loandesk-agent
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
