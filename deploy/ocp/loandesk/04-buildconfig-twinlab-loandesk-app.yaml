apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: twinlab-loandesk-app
  namespace: twinlab
  labels:
    app.kubernetes.io/part-of: twinlab
    app.kubernetes.io/instance: loandesk
    app.kubernetes.io/component: app-image
    app.kubernetes.io/name: twinlab-loandesk-app-image
    app.kubernetes.io/managed-by: labctl
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/karuppusamym/twin-lab.git
      ref: main
    contextDir: apps/loandesk
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: twinlab-loandesk-app:latest
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 3Gi
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  triggers: []
