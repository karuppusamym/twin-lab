apiVersion: v1
kind: Service
metadata:
  name: twinlab-loandesk-agent
  namespace: twinlab
  labels:
    app.kubernetes.io/part-of: twinlab
    app.kubernetes.io/instance: loandesk
    app.kubernetes.io/component: lab
    app.kubernetes.io/name: twinlab-loandesk-lab
    app.kubernetes.io/managed-by: labctl
spec:
  selector:
    app.kubernetes.io/instance: loandesk
    app.kubernetes.io/component: lab
  ports:
  - name: http
    port: 9000
    targetPort: http
    protocol: TCP
