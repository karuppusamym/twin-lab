# The certification matrix: one entry per technology (and version), each on a small real
# reference application, each through the same four gates. Run with `labctl certify`; the gates
# and how to add a technology are in docs/10-certification.md.
#
# gates.detect: what the lab must detect (every key given is compared; `version` always).
# gates.capture: the actions the flow has, written by hand from the flow (never from a recording):
#   `expected` (a list here), `expected_from` (a list in the flow file) or `expected_file` (the
#   `actions` of a YAML file kept beside the application).
# gates.self-replay.values: synthetic values a replay types, per field, in order.
# gates.self-replay.records: the title of each record a step acts on that was there before the
#   recording started, in order.
# gates.self-replay.bindings_from: a function of the flow file that gives every value instead.
# gates.rebuild.report: a kept replay report of a rebuilt copy (a path from the repository root).
version: 1
entries:
  - id: html-forms
    technology: Server-rendered HTML forms
    surface: web
    app:
      kind: python
      file: lab/labctl/tests/fixtures/multiapp/apps.py
      serve: serve
      origins: [orders, billing, widget]
      start: "{orders}/login"
    flow:
      file: lab/labctl/tests/fixtures/multiapp/flow.py
      run: run
    gates:
      detect: {framework: server-rendered, rendering: server}
      capture: {expected_from: EXPECTED}  # 62 actions, declared by hand in the flow file
      self-replay:
        values:
          "#username": [clerk.syn]
          "#password": [Syn-pass-1]
          "#searchBy": [Customer name, Order number]
          "#q": [Lindqvist, ORD-1026, QQQ-0001]  # ORD-1026: a fresh instance's first new order
          "#customerName": [Syn Customer]
          "#customerEmail": [syn-bad, syn@example.test]
          "#customerPhone": [0100 111 2222, 0100 111 3333]
          "#product": [Desk lamp]
          "#quantity": ["0", "2"]
          "#deliveryDate": ["2027-01-15"]
          "#notes": [Syn note one, Syn note two]
          orderRef: [BAD9, ORD-1026, ORD-1026]
          payer: [Syn Payer]
          terms: [30 days]
          amount: [abc, "88.20"]
          memo: [Syn memo]
      rebuild: {}
    not_covered:
      - no server technology is declared (the fixture is Python's http.server and shows no marker)
      - file upload and download
      - a rebuild by a coding agent

  - id: react-16
    technology: React
    version: "16.7.0"
    surface: web
    app:
      kind: static
      folder: apps/web-todo/static
      start: /index.html
      requires: [vendor/react.js, vendor/react-dom.js]
      requires_reason: built from node_modules by build.cjs, not in Git
    flow:
      file: certification/flows/react_todo.py
      run: run
    gates:
      detect: {framework: react, version: "16.7.0", rendering: client}
      capture:
        expected:
          - type            # first task
          - keypress:Enter
          - type            # second task
          - keypress:Enter
          - check           # complete the first
          - click           # Active
          - click           # Completed
          - click           # All
          - dblclick        # edit the second
          - type
          - keypress:Escape
          - dblclick
          - type
          - keypress:Enter
          - goto:reload
          - check           # complete all
          - click           # Clear completed
          - type            # third task
          - keypress:Enter
          - click           # delete it
      self-replay:
        values:
          input.new-todo: [Syn task one, Syn task two, Syn task three]
          input.edit: [Syn edit dropped, Syn task two changed]
      rebuild: {}
    not_covered:
      - React 17 and later (other bundle markers)
      - a router, a data API, a component library
      - the files are served as static files, not by the app's own server.py
      - a rebuild by a coding agent

  # Caseboard (Angular): the committed production build (`site/`), served by the application's
  # own serve.py, which answers a route's address with index.html (a plain file server would
  # not). The values are flow.INPUTS and flow.RECORDS (tests/test_certify.py compares them).
  - id: angular
    technology: Angular
    version: "21.2.26"
    surface: web
    app:
      kind: module
      file: reference/web/caseboard-angular/serve.py
      serve: serve
      namespace: caseboard_angular
      start: /
      folder: reference/web/caseboard-angular/site
      requires: [index.html]
      requires_reason: the production build, made by `npm run site`
    flow:
      file: reference/web/caseboard-angular/flow.py
      run: flow
      base_url: true
    gates:
      detect: {framework: angular, version: "21.2.26", rendering: client}
      capture: {expected_file: reference/web/caseboard-angular/expected-actions.yaml}  # 34
      self-replay:
        values:
          input#username: [demo]
          input#password: [not-the-password, demo]
          input#search: [valve]
          input#title: [Position sensor recalibrated]
          select#status: [waiting]
          input#dueDate: ["2026-12-18"]
          textarea#notes: ["Checked on site, readings are back to normal."]
        records:
          - CB-1007 Valve position sensor reads zero Gray Open Normal 2026-12-11 No
      rebuild: {}
    not_covered:
      - other Angular versions; zone.js change detection (the build is zoneless)
      - server-side rendering and hydration, Angular Material, CDK overlays
      - HttpClient calls (the state is in memory, so no request is replayed)
      - the route guard's redirect from / is recorded, not checked again by the replay
      - a rebuild by a coding agent

  # Declared for later: what the lab must detect is given, the application and the flow are not.
  # Set `version` (and gates.detect.version) when the reference application is chosen.
  - id: vue
    technology: Vue
    surface: web
    app: null
    flow: null
    gates:
      detect: {framework: vue, rendering: client}
    not_run: no reference application has been built for it yet
    not_covered: [everything, nothing has run]

  # Caseboard (JSF): Mojarra 2.3.9 on an embedded Jetty, started by the application's own
  # run.py (a Java process per instance). It needs a JDK and the 14 jars fetch_libs.py puts in
  # lib/ (not in Git): without them the entry is NOT RUN with that reason. No page or header
  # names the implementation's release, so what is declared is what the pages show: the
  # specification version (2.3) and the implementation (Mojarra).
  - id: jsf-mojarra
    technology: JSF (Mojarra)
    version: "2.3"
    surface: web
    app:
      kind: module
      file: reference/web/caseboard-jsf/run.py
      serve: serve
      namespace: caseboard_jsf
      start: /login.xhtml
      unavailable: reference/web/caseboard-jsf/build.py:unavailable
    flow:
      file: reference/web/caseboard-jsf/flow.py
      run: flow
      base_url: true
    gates:
      detect:
        framework: JSF
        version: "2.3"
        rendering: server
        server:
          technology: Java
          framework: JSF
          framework_version: "2.3"
          implementation: Mojarra
      capture: {expected_file: reference/web/caseboard-jsf/expected-actions.yaml}  # 24
      self-replay: {bindings_from: bindings_for}  # flow.TYPED, per type and select step
      rebuild: {}
    not_covered:
      - "PrimeFaces, RichFaces and other component libraries (plain h: components only)"
      - MyFaces; Jakarta Faces 3 and later; client-side state saving
      - the implementation's release (2.3.9) is in no page or header, so it is not compared
      - the acceptance cases flow.acceptance_for declares are run by the application's own test, not here
      - a rebuild by a coding agent

  - id: aspnet-webforms
    technology: ASP.NET Web Forms
    surface: web
    app: null   # to fill: a Web Forms site on IIS Express (.NET Framework 4.x)
    flow: null
    gates:
      detect:
        framework: ASP.NET Web Forms
        rendering: server
        server: {technology: .NET, framework: ASP.NET Web Forms}
    not_run: no reference application has been built for it yet
    not_covered: [everything, nothing has run]

  # Desktop entries start a GUI application and click with the real mouse. They run only on
  # Windows with TWINLAB_DESKTOP_GUI=1. Each app folder has flow.py with build() and flow. The
  # expected actions are written from that flow: a click on a menu item is `menu` (two for a
  # path of two), a combo box choice is `select`, a click on a check box is `toggle`.
  - id: winforms
    technology: WinForms
    version: ".NET 6"
    surface: desktop
    app: {kind: winforms, folder: reference/desktop/CaseDesk}
    gates:
      detect: {toolkit: WinForms, runtime: {name: .NET, version: "6"}}
      capture:
        expected:
          - type         # user name
          - type         # a wrong password
          - click        # Sign in
          - click        # OK in the message box
          - type         # the password
          - click        # Sign in
          - type         # search text
          - "key:Enter"  # presses Search, the default button
          - menu         # Case (the menu bar)
          - menu         # Refresh
          - click        # Open
          - type         # a summary that is too short
          - select       # status: Resolved
          - toggle       # Urgent
          - click        # Save
          - click        # OK in the message box
          - type         # a longer summary
          - click        # Save
          - menu         # File
          - menu         # Exit
      self-replay:
        values:
          txtPassword: [wrong, demo]
          txtSearch: C-100
      rebuild: {}
    not_covered:
      - .NET Framework 4.x builds
      - third-party grids and custom-drawn controls
      - a rebuild by a coding agent

  - id: wpf
    technology: WPF
    version: ".NET 6"
    surface: desktop
    app: {kind: wpf, folder: reference/desktop/CaseDeskWpf}
    gates:
      detect: {toolkit: WPF, runtime: {name: .NET, version: "6"}}
      capture:
        expected:
          - type         # user name
          - type         # a wrong password (real key presses, as the second)
          - click        # Sign in
          - click        # OK in the message box
          - type         # the password
          - click        # Sign in
          - type         # search text
          - "key:Enter"  # presses Search, the default button
          - menu         # Case (the menu bar)
          - menu         # Refresh
          - click        # Open
          - type         # a summary that is too short
          - select       # status: Resolved
          - toggle       # Urgent
          - click        # Save
          - click        # OK in the message box
          - type         # a longer summary
          - click        # Save
          - menu         # File
          - menu         # Exit
      self-replay:
        values:
          txtPassword: [wrong, demo]
          txtSearch: C-100
      rebuild: {}
    not_covered:
      - .NET Framework 4.x builds
      - data templates, virtualised lists, third-party controls
      - a rebuild by a coding agent

  - id: java-swing
    technology: Java Swing
    version: "Java 11"
    surface: desktop
    app: {kind: swing, folder: reference/desktop/CaseDeskSwing}
    gates:
      detect: {toolkit: Java Swing / AWT}
      capture:
        expected:
          - type         # user name
          - type         # a wrong password
          - click        # Sign in
          - click        # OK in the message box
          - type         # the password
          - click        # Sign in
          - type         # search text
          - click        # Search
          - menu         # Case (the menu bar)
          - menu         # Refresh
          - click        # Open
          - type         # a summary that is too short
          - select       # status: Resolved
          - toggle       # Urgent
          - click        # Save
          - click        # OK in the message box
          - type         # a longer summary
          - click        # Save
          - menu         # File
          - menu         # Exit
      self-replay:
        values:
          Password: [wrong, demo]
          Case or name: C-100
      rebuild: {}
    not_covered:
      - the Java version is not detected, so it is not compared
      - JavaFX and SWT
      - a rebuild by a coding agent
