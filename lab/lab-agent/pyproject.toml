# The lab agent package. The image does not install it (it runs from PYTHONPATH); this file
# names its dependencies for local installs and tells ruff where its first-party code lives.
[project]
name = "twinlab-lab-agent"
version = "0.1.0"
description = "Front door of one Twin Lab demo app: HTTP proxy, DB link proxy, admin API."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.6",
    "starlette>=0.40",
    "uvicorn>=0.29",
]

[tool.ruff]
extend = "../../pyproject.toml"
src = [".", "../labctl"]
