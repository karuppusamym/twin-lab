<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Twin Lab{% endblock %}</title>
  <link rel="stylesheet" href="/static/portal.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Twin Lab</a>
  <nav>
    {% set here = request.url.path %}
    <a href="/" class="{{ 'on' if here == '/' or here.startswith('/apps') }}">Apps</a>
    <a href="/automations" class="{{ 'on' if here.startswith('/automations') }}">Automations</a>
    <a href="/flows" class="{{ 'on' if here.startswith('/flows') }}">Flows</a>
    <a href="/mapping" class="{{ 'on' if here.startswith('/mapping') }}">Readiness</a>
    <a href="/settings" class="{{ 'on' if here.startswith('/settings') }}">Settings</a>
  </nav>
</header>
<main>
  {% if flash %}<div class="flash {{ 'error' if flash_kind == 'error' else 'ok' }}" role="status">{{ flash }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="/static/portal.js"></script>
</body>
</html>
