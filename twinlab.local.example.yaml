# Copy to twinlab.local.yaml (Git-ignored) and fill in. Never commit the real file.
# Environment variables with the same names override these values.
# Details: docs/devin.md

# Devin service-user key: Devin > Settings > Devin API > Service users. Starts with cog_.
DEVIN_API_KEY: cog_REPLACE_WITH_SERVICE_USER_KEY

# Organisation id, shown on the same Devin settings page.
DEVIN_ORG_ID: REPLACE_WITH_ORG_ID

# Leave as is unless you use the local mock (http://127.0.0.1:8740).
DEVIN_BASE_URL: https://api.devin.ai

# The GitHub repository Devin opens the pull request in, as owner/name.
GITHUB_REPO: your-org/twin-lab

# Where jobs and packages are kept. Relative paths are under the repository root.
STATE_DIR: .lab-state

# Database servers the DBA prepared for demo apps (optional). Twin Lab can also run PostgreSQL or
# SQL Server itself ("postgres", "sqlserver"); an app picks one on its page or with
# `labctl db use <app> <name>`. Passwords: an environment variable named here is best; a value
# written in this (Git-ignored) file also works. Check with `labctl db check <name>`.
databases:
  qtt-sqlserver:
    engine: mssql                      # mssql | oracle | postgresql
    host: sqldemo01.office.local
    port: 1433
    database: TWINLAB_QTT              # Oracle: write `service: FREEPDB1` instead
    owner_user: twinlab_owner          # may create tables and load data
    owner_password_env: TL_QTT_OWNER_PASSWORD
    bot_user: twinlab_bot              # what bots get: read and change rows only
    bot_password_env: TL_QTT_BOT_PASSWORD
